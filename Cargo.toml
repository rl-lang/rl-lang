[workspace]
resolver = "2"
members = [
    "crates/rl-utils",
    "crates/rl-lexer",
    "crates/rl-ast",
    "crates/rl-parser",
    "crates/rl-resolver",
    "crates/rl-vm",
    "crates/rl-cranelift",
    "crates/rl-checker",
    "crates/rl-docs",
    "crates/rl-tooling",
    "crates/rl-repl",
    "crates/rl-lsp",
    "crates/rl-cli",
    "crates/rl-commons",
    "crates/rl-std-core",
    "crates/rl-std-macros",
    "crates/rl-std",
    "crates/rl-tests",
    "crates/rl-benches",
    "crates/rl-cc",
    "crates/rl-pm",
    "crates/rl-manager",
]

[workspace.package]
version = "2.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rl-lang/rl-lang"

[workspace.dependencies]
rl-commons = { path = "crates/rl-commons", version = "2.2.0" }
rl-std-core = { path = "crates/rl-std-core", version = "2.2.0" }
rl-std-macros = { path = "crates/rl-std-macros", version = "2.2.0" }
rl-std = { path = "crates/rl-std", version = "2.2.0" }
rl-utils = { path = "crates/rl-utils", version = "2.2.0" }
rl-lexer = { path = "crates/rl-lexer", version = "2.2.0" }
rl-ast = { path = "crates/rl-ast", version = "2.2.0" }
rl-parser = { path = "crates/rl-parser", version = "2.2.0" }
rl-resolver = { path = "crates/rl-resolver", version = "2.2.0" }
rl-vm = { path = "crates/rl-vm", version = "2.2.0" }
rl-cranelift = { path = "crates/rl-cranelift", version = "2.2.0" }
rl-checker = { path = "crates/rl-checker", version = "2.2.0" }
rl-docs = { path = "crates/rl-docs", version = "2.2.0" }
rl-tooling = { path = "crates/rl-tooling", version = "2.2.0" }
rl-repl = { path = "crates/rl-repl", default-features = false, version = "2.2.0" }
rl-lsp = { path = "crates/rl-lsp", version = "2.2.0" }
rl-cc = { path = "crates/rl-cc", version = "2.2.0" }
rl-pm = { path = "crates/rl-pm", version = "2.2.0" }
rl-manager = { path = "crates/rl-manager", version = "2.2.0" }

criterion = { version = "0.5", features = ["html_reports"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
ariadne = "0.5"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
ureq = "2"
libloading = "0.8"
libffi = "5"
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
cranelift-jit = "0.116"
cranelift-module = "0.116"
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
target-lexicon = "0.13"
zstd = "0.13"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
cpal = "0.17"
symphonia = { version = "0.5", features = ["all"] }
eframe = { version = "0.35", features = ["android-game-activity"] }
shell-words = "1.1"
libc = "0.2"
tempfile = "3.27.0"
glob = "0.3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zip = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Nightly/dev builds: thin LTO + more codegen units = much faster builds.
# Quality is slightly lower than release but still optimized.
[profile.nightly]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 4

# Debug-optimized builds: fast compilation, no LTO.
# Good for testing and development without waiting for LTO.
[profile.dev-release]
inherits = "dev"
opt-level = 3
lto = false
codegen-units = 16

# Benchmarks should reflect the same optimisations as shipped releases,
# otherwise the numbers misrepresent the real binaries.
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
