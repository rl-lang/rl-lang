[package]
name = "rl-repl"
version.workspace = true
readme = "readme.md"
edition.workspace = true
license.workspace = true
description = "Interactive REPL for the rl-lang programming language"
repository.workspace = true

[lib]
name = "rl_repl"
path = "src/lib.rs"

[[bin]]
name = "rlrepl"
path = "src/bin/rlrepl.rs"

[dependencies]
rl-ast.workspace = true
rl-docs.workspace = true
rl-parser.workspace = true
rl-lexer.workspace = true
rl-resolver = { workspace = true, optional = true }
rl-utils.workspace = true
rl-vm = { workspace = true, optional = true }
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true

[features]
default = ["vm"]
vm = ["dep:rl-vm", "dep:rl-resolver"]
