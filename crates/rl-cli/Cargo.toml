[package]
name = "rl-cli"
version.workspace = true
readme = "readme.md"
edition.workspace = true
license.workspace = true
description = "Command-line interface for the rl-lang toolchain"
repository.workspace = true

[lib]
name = "rl_cli"
path = "src/lib.rs"

[[bin]]
name = "rl"
path = "src/main.rs"

[[bin]]
name = "rlc"
path = "src/bin/rlc.rs"
required-features = ["vm"]

[[bin]]
name = "rlt"
path = "src/bin/rlt.rs"
required-features = ["cc"]

[dependencies]
rl-utils.workspace = true
rl-lexer.workspace = true
rl-ast.workspace = true
rl-parser.workspace = true
rl-resolver.workspace = true
rl-vm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rl-cranelift = { workspace = true, optional = true }
rl-checker.workspace = true
rl-docs = { workspace = true, optional = true }
rl-tooling.workspace = true
rl-repl = { workspace = true, optional = true }
rl-lsp = { workspace = true, optional = true }
clap.workspace = true
toml.workspace = true
serde.workspace = true
log = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
rl-cc = { workspace = true, optional = true }
rl-pm = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["repl", "vm", "docs", "docs-tui", "pm"]
run = []
vm = ["dep:rl-vm"]
cranelift = ["vm", "rl-cranelift"]
repl = ["dep:rl-repl", "rl-repl/vm"]
docs = ["dep:rl-docs"]
docs-tui = ["docs", "rl-docs/tui"]
debug = ["dep:env_logger", "dep:log"]
lsp = ["dep:rl-lsp", "dep:tokio"]
cc = ["dep:rl-cc"]
pm = ["dep:rl-pm"]

[[test]]
name = "cc"
path = "tests/cc.rs"
required-features = ["cc"]
