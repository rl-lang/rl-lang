name: Build Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: true
        type: string
      build-profile:
        description: "Cargo build profile (release, nightly, dev-release)"
        required: false
        type: string
        default: "release"
    secrets:
      DISCORD_ANNOUNCEMENT_WEBHOOK:
        required: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: windows
            arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            arch: aarch64
          - target: aarch64-linux-android
            os: ubuntu-latest
            platform: android
            arch: aarch64

    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_CACHE_TAG: rl-v2-${{ matrix.target }}
      RUSTC_WRAPPER: "sccache"
      RL_BUILD_PROFILE: ${{ inputs.build-profile }}
    steps:
      - name: Install build deps (linux)
        if: matrix.os == 'ubuntu-latest' && matrix.platform != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo dpkg --add-architecture arm64
            sudo printf '%s\n' \
              'Types: deb' \
              'URIs: http://archive.ubuntu.com/ubuntu/' \
              'Suites: noble noble-updates noble-backports' \
              'Components: main restricted universe multiverse' \
              'Architectures: amd64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              '' \
              'Types: deb' \
              'URIs: http://security.ubuntu.com/ubuntu/' \
              'Suites: noble-security' \
              'Components: main restricted universe multiverse' \
              'Architectures: amd64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              '' \
              'Types: deb' \
              'URIs: http://ports.ubuntu.com/ubuntu-ports/' \
              'Suites: noble noble-updates noble-backports' \
              'Components: main restricted universe multiverse' \
              'Architectures: arm64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              '' \
              'Types: deb' \
              'URIs: http://ports.ubuntu.com/ubuntu-ports/' \
              'Suites: noble-security' \
              'Components: main restricted universe multiverse' \
              'Architectures: arm64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              | sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64
          fi

      - name: Install build deps (macos)
        if: matrix.platform == 'macos'
        run: brew install pkg-config

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.platform == 'android'
        run: sdkmanager "ndk;27.0.12077973"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zip (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install zip -y

      - name: Start sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Build all binaries
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "android" ]; then
            NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
            if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
              NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
            fi
            if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
              NDK_ROOT="$(ls -d "$ANDROID_HOME"/ndk/* "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | head -n1)"
            fi
            if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
              echo "Android NDK not found" >&2
              exit 1
            fi
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
            export CC_aarch64_linux_android="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
            export CXX_aarch64_linux_android="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
            export AR_aarch64_linux_android="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          elif [ "${{ matrix.arch }}" = "aarch64" ] && [ "${{ matrix.platform }}" = "linux" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          bash build-variants.sh ${{ matrix.target }} ${{ matrix.platform }} ${{ matrix.arch }} dist

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

  collect:
    name: Collect artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: Bundle all artifacts
        run: |
          mkdir -p bundle
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} bundle/ \;
          echo "=== Artifacts ==="
          ls -lh bundle/
          echo ""
          echo "=== Checksums ==="
          cat bundle/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: bundle/*
